name: SHAHMC
version: 1.0.0
main: com.shahmc.shahmcplugin.SHAHMCPlugin
api-version: '1.20'
authors: ["SHAHMC"]
description: "پلاگین حرفه‌ای لابی و SMP برای سرور SHAHMC"
commands:
  lobby:
    description: رفتن به لابی
    usage: /lobby
    aliases: [spawn]
  setlobby:
    description: تنظیم مکان لابی
    usage: /setlobby
    permission: shahmc.setlobby
  smp:
    description: اطلاعات سرور و مدل SMP
    usage: /smp
  npc:
    description: ساخت NPC لابی
    usage: /npc
    permission: shahmc.npc
